title: "Bennett McAuley"
description: "A constellation of projects, analytics, and process design."
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "mint"

# Site settings
locale: "en-US"
url: "https://bmcauley.github.io"
baseurl: ""   # IMPORTANT: must be empty for username.github.io sites

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-include-cache

# Author
author:
  name: "Bennett McAuley"
  bio: "HRIS/People Ops hybrid analyst, cosmic druid, Markdown wizard."

# Navigation
nav:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "Blog"
    url: "/blog/"
  - title: "About"
    url: "/about/"

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
