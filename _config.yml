title: ""
description: "A constellation of projects, analytics, and process design."
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "dark"

# Site settings
locale: "en-US"
url: "https://bmcauley.github.io"
baseurl: ""   # IMPORTANT: must be empty for username.github.io sites

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-include-cache

# Author
author:
  name: "Bennett McAuley"
  avatar: "assets/images/my-notion-face-transparent.png"
  bio: "Born to be an overthinker, trained to be a statistician, proven to be an advocate for all."
  location: "RTP, NC"
  uri: null
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin-in"
      url: "https://linkedin.com/in/bennett-mcauley/"

# Navigation
nav:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      published: false

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
