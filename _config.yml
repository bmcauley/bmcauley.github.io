title: "Bennett's Cosmic Portfolio"
description: "A constellation of projects, analytics, and process design." # shows up when sharing on other platforms

# Minimal Mistakes settings
minimal_mistakes_skin: "default" # to be changed, potentially

# Build settings
markdown: kramdown
plugins:
  - jekyll-include-cache

# Author info
author:
  name: "Bennett"
  avatar: "/assets/images/avatar.png"   # optional
  bio: "HRIS/People Ops analyst"

# Navigation (you can expand later)
nav:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Projects"
    url: "/projects/"

# Collections (optional but useful)
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults (helps pages render correctly)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: true

